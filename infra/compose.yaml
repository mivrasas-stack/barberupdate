name: barberos-updatebackend
services:
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["sh","-ec","exec redis-server --appendonly yes --appendfsync everysec --maxmemory 256mb --maxmemory-policy noeviction --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    volumes: [redis_data:/data]
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 10s
      timeout: 3s
      retries: 10
  api1: &api
    build:
      context: ../backend
      dockerfile: ../infra/Dockerfile.api
    restart: unless-stopped
    environment: &env
      NODE_ENV: production
      PORT: 8080
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL for Supabase pooler}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-8}
      SUPABASE_URL: ${SUPABASE_URL:?Set SUPABASE_URL}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:?Set SUPABASE_PUBLISHABLE_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD}@redis:6379
      CORS_ORIGINS: ${CORS_ORIGINS:?Set CORS_ORIGINS}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-90}
      MEDIA_BUCKET: ${MEDIA_BUCKET:-barberos-images}
      WHATSAPP_SEND_ENABLED: ${WHATSAPP_SEND_ENABLED:-false}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_GRAPH_VERSION: ${WHATSAPP_GRAPH_VERSION:-v23.0}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
      WHATSAPP_WEBHOOK_VERIFY_TOKEN: ${WHATSAPP_WEBHOOK_VERIFY_TOKEN:-}
    depends_on:
      redis:
        condition: service_healthy
    networks: [backend]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
  api2:
    <<: *api
  worker:
    <<: *api
    command: ["node","src/worker.js"]
  lb:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports: ["127.0.0.1:${PUBLIC_API_PORT:-8188}:80"]
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on: [api1,api2]
    networks: [backend]
networks:
  backend: {}
volumes:
  redis_data: {}
