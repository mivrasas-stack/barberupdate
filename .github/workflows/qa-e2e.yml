name: QA real end-to-end (manual)

on:
  workflow_dispatch:
  push:
    branches: [fix/stabilization-five-priorities-20261014]
    paths: ['.github/workflows/qa-e2e.yml']

permissions:
  contents: read

jobs:
  browser-integration:
    if: github.ref_name == 'fix/stabilization-five-priorities-20261014'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SUPABASE_URL: ${{ secrets.QA_SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.QA_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.QA_SUPABASE_SERVICE_ROLE_KEY }}
      DATABASE_URL: ${{ secrets.QA_DATABASE_URL }}
      ADMIN_DATABASE_URL: ${{ secrets.QA_ADMIN_DATABASE_URL }}
      VITE_SUPABASE_URL: ${{ secrets.QA_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.QA_SUPABASE_PUBLISHABLE_KEY }}
      VITE_BACKEND_MODE: live
      VITE_API_BASE_URL: /api/v1
      CORS_ORIGINS: http://127.0.0.1:3001,http://localhost:3001
      PUBLIC_API_PORT: '8188'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Check isolated QA prerequisites
        id: qa
        shell: bash
        run: |
          set -euo pipefail
          for key in SUPABASE_URL SUPABASE_PUBLISHABLE_KEY SUPABASE_SERVICE_ROLE_KEY DATABASE_URL ADMIN_DATABASE_URL; do
            if test -z "${!key}"; then
              echo "QA integration not configured: missing $key"
              echo "ready=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          test "$SUPABASE_URL" = "https://wrfwhftzaflwhkvkzrjm.supabase.co" || { echo "Refusing: wrong Supabase QA project"; exit 1; }
          [[ "$DATABASE_URL" == *wrfwhftzaflwhkvkzrjm* ]] || { echo "Refusing: API database not QA project"; exit 1; }
          [[ "$ADMIN_DATABASE_URL" == *wrfwhftzaflwhkvkzrjm* ]] || { echo "Refusing: admin database not QA project"; exit 1; }
          echo "REDIS_PASSWORD=$(openssl rand -hex 20)" >> "$GITHUB_ENV"
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - if: steps.qa.outputs.ready == 'true'
        run: npm ci
      - if: steps.qa.outputs.ready == 'true'
        run: npm ci
        working-directory: backend
      - if: steps.qa.outputs.ready == 'true'
        name: Start isolated test API and Redis
        run: docker compose -f infra/compose.yaml up -d --build --wait
      - if: steps.qa.outputs.ready == 'true'
        name: Wait for backend readiness
        shell: bash
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8188/api/v1/health/ready >/dev/null; then exit 0; fi
            sleep 2
          done
          docker compose -f infra/compose.yaml ps
          exit 1
      - if: steps.qa.outputs.ready == 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.qa.outputs.ready == 'true'
        name: Exercise live roles, QR, bookings, inventory and image persistence
        run: npx playwright test tests/e2e/connection.spec.js --config=playwright.local3001.config.ts --reporter=line
      - if: failure() && steps.qa.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: qa-playwright-failures
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
      - if: always() && steps.qa.outputs.ready == 'true'
        run: docker compose -f infra/compose.yaml down --volumes || true
