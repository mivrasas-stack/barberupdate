name: BarberOS Frontend CI
on:
  pull_request:
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - '.github/workflows/frontend-ci.yml'
jobs:
  frontend-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install
        run: npm ci --ignore-scripts --no-audit
      - name: TypeScript checks
        run: npm run lint
      - name: Production build
        run: npm run build
