name: Platform Integrations Migration QA
on:
  pull_request:
    paths:
      - 'supabase/migrations/*platform_integrations*'
      - 'backend/scripts/verify-platform-integrations-migration.mjs'
      - '.github/workflows/platform-integrations-migration.yml'
  push:
    branches: [feat/superadmin-integrations-center-20261014]
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: localtest
          POSTGRES_DB: integrations_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d integrations_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --ignore-scripts --no-audit
        working-directory: backend
      - name: Run isolated integration vault migration security checks
        env:
          INTEGRATIONS_TEST_DATABASE_URL: postgresql://postgres:localtest@127.0.0.1:5432/integrations_ci
        run: node backend/scripts/verify-platform-integrations-migration.mjs
