name: COP Currency UI QA
on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/unit/**'
      - 'package.json'
      - '.github/workflows/cop-ui.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/unit/**'
      - 'package.json'
      - '.github/workflows/cop-ui.yml'
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit
      - run: npm run test:cop
      - run: npx tsc --noEmit
      - run: npm run build
